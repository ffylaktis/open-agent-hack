# Tooling config only (lint + tests). No [project] table — this repo runs as scripts, not a
# published package; runtime deps live in requirements.txt, dev tools in requirements-dev.txt.

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]   # pycodestyle errors/warnings, pyflakes, bugbear

[tool.ruff.lint.per-file-ignores]
"agent/web.py" = ["E501"]       # the self-contained UI is one HTML/JS string literal

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
  "live: needs the running Zetaris + Meterless stack (skipped unless --run-live or RUN_LIVE=1)",
]
